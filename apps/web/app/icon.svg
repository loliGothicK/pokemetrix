<svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
      <mask id="cutout-mask">
      <!-- 白い部分は表示され、黒い部分は透過される -->
      <rect width="200" height="200" fill="white" />
      <!-- 中抜きする元のデザイン（黒で描画） -->
      <circle cx="100" cy="100" r="84" fill="none" stroke="black" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="64.4 35.6" stroke-dashoffset="0" transform="rotate(-90 100 100)" />
      <circle cx="100" cy="100" r="84" fill="none" stroke="black" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="27.6 72.4" stroke-dashoffset="-68.4" transform="rotate(-90 100 100)" />
      <rect x="47" y="55" width="16" height="33" rx="3" fill="black" />
      <rect x="77" y="35" width="16" height="48" rx="3" fill="black" />
      <rect x="107" y="45" width="16" height="38" rx="3" fill="black" />
      <rect x="137" y="65" width="16" height="23" rx="3" fill="black" />
      <line x1="34.873" y1="100.794" x2="165.374" y2="100.197" stroke="black" stroke-width="11.865" stroke-linecap="round" stroke-dasharray="40.4 60.4" stroke-dashoffset="6" />
      <circle cx="100" cy="100" r="24" fill="none" stroke="black" stroke-width="12" />
      <circle cx="100" cy="100" r="8" fill="black" />
    </mask>
  </defs>

  <circle cx="100" cy="100" r="95" fill="#ffffff" mask="url(#cutout-mask)" />
  <!-- シアンの部分は上から描画（もし中抜きでなく色を残したい場合）-->
  <circle
    cx="100" cy="100" r="84"
    fill="none"
    stroke="#2c2c54"
    stroke-width="12"
    stroke-linecap="round"
    pathLength="100"
    stroke-dasharray="64.4 35.6"
    stroke-dashoffset="0"
    transform="rotate(-90 100 100)"
  />
  <circle
    cx="100" cy="100" r="84"
    fill="none"
    stroke="#66C5D0"
    stroke-width="12"
    stroke-linecap="round"
    pathLength="100"
    stroke-dasharray="27.6 72.4"
    stroke-dashoffset="-68.4"
    transform="rotate(-90 100 100)"
  />
  <rect x="47" y="55" width="16" height="33" rx="3" fill="#66C5D0" />
  <rect x="77" y="35" width="16" height="48" rx="3" fill="#66C5D0" />
  <rect x="107" y="45" width="16" height="38" rx="3" fill="#66C5D0" />
  <rect x="137" y="65" width="16" height="23" rx="3" fill="#66C5D0" />

  <line
   x1="34.873"
   y1="100.794"
   x2="165.374"
   y2="100.197"
   stroke="#2c2c54"
   stroke-width="11.865"
   stroke-linecap="round"
   stroke-dasharray="40.4 60.4"
   stroke-dashoffset="6"
   />
  <circle cx="100" cy="100" r="24" fill="none" stroke="#2c2c54" stroke-width="12" />
  <circle cx="100" cy="100" r="8" fill="#2c2c54" />

</svg>
