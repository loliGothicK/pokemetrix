[workspace]
members = ["damage-calc", "data", "engine"]
resolver = "2"

[profile.release]
opt-level = 3

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0"
tsify = { version = "0.5.8", features = ["js"] }
wasm-bindgen = "0.2"
deriving_via = "2.3.1"

[workspace.build-dependencies]
serde = { version = "1.0", features = ["derive"] }
