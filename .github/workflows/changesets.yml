name: Changesets

on:
  push:
    branches:
      - main

jobs:
  version:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: Release
    env:
      CI: true
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./package.json

      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Create and publish versions
        uses: changesets/action@v1
        with:
          commit: "chore: update versions"
          title: "chore: update versions"
          version: pnpm run version
          publish: bash -c 'LOCAL=$(jq -r .version packages/damage-calc/package.json); REMOTE=$(npm view @pokemetrix/damage-calc version 2>/dev/null || echo ""); if [ "$LOCAL" != "$REMOTE" ]; then pnpm --filter @pokemetrix/damage-calc run release; else echo "Version unchanged"; fi'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
