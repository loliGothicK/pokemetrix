name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Cache
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./package.json

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages/damage-calc"

      - name: Build WebAssembly
        run: pnpm --filter @pokemetrix/damage-calc run build

      - name: Lint
        run: pnpm lint

      - name: Build Next.js App
        run: pnpm build:app

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test WebAssembly (Chrome)
        run: wasm-pack test --headless --chrome packages/damage-calc

      - name: Test WebAssembly (Firefox)
        run: wasm-pack test --headless --firefox packages/damage-calc

      - name: Test Rust (cargo nextest)
        run: cargo nextest run --profile ci --workspace

      - name: Test Next.js (Vitest)
        run: pnpm --filter @pokemetrix/app run test:ci

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure() # always run even if tests fail
        with:
          report_paths: '**/junit.xml,**/test-results/*.xml'
          check_name: 'JUnit Test Report'

